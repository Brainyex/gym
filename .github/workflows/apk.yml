# Сборка Android-приложения «Мой зал» из index.html
name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android project
        env:
          KS: 
        run: |
          B=a/app/src/main
          mkdir -p $B/java/ru/brainyex/gym $B/assets $B/res/mipmap-anydpi-v26 $B/res/drawable
          cp index.html $B/assets/index.html
          echo "$KS" | base64 -d > a/gym.jks
          cat > a/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'gym'
          include ':app'
          EOF
          cat > a/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > a/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def vc = Integer.parseInt(System.getenv('VC') ?: '1')
          android {
            namespace 'ru.brainyex.gym'
            compileSdk 34
            defaultConfig {
              applicationId 'ru.brainyex.gym'
              minSdk 26
              targetSdk 34
              versionCode vc
              versionName "1." + vc
            }
            signingConfigs {
              rel { storeFile file('../gym.jks'); storePassword 'gymgym123'; keyAlias 'gym'; keyPassword 'gymgym123' }
            }
            buildTypes { release { signingConfig signingConfigs.rel; minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > $B/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Мой зал" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $B/res/drawable/ic_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FF7A3D"/></shape>
          EOF
          cat > $B/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#1A0D05" android:pathData="M34,51h40v6h-40z M30,38h8v32h-8z M70,38h8v32h-8z M24,44h6v20h-6z M78,44h6v20h-6z"/>
          </vector>
          EOF
          cat > $B/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > $B/java/ru/brainyex/gym/MainActivity.java <<'EOF'
          package ru.brainyex.gym;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              int bg = Color.parseColor("#0e1014");
              getWindow().setStatusBarColor(bg);
              getWindow().setNavigationBarColor(bg);
              web = new WebView(this);
              web.setBackgroundColor(bg);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              web.addJavascriptInterface(new Bridge(), "Android");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("file".equals(u.getScheme())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              web.evaluateJavascript("(window.androidBack && window.androidBack()) ? '1' : '0'", v -> {
                if (!"\"1\"".equals(v)) finish();
              });
            }

            public class Bridge {
              @JavascriptInterface
              public void share(final String text) {
                runOnUiThread(() -> {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_SUBJECT, "Мой зал — резервная копия");
                  i.putExtra(Intent.EXTRA_TEXT, text);
                  startActivity(Intent.createChooser(i, "Сохранить копию"));
                });
              }
            }
          }
          EOF
      - name: Build APK
        env:
          VC: ${{ github.run_number }}
        run: |
          cd a
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MoyZal-v1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MoyZal-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Мой зал 1.${{ github.run_number }}
          files: MoyZal-*.apk
