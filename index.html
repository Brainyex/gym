<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой зал</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13; --card:#161a22; --card2:#1e2430; --line:#283040;
  --ink:#f3f4f7; --ink2:#aab1be; --ink3:#6e7686;
  --o:#ff7a3d; --v:#a78bfa; --r:#ff5d8f; --k:#f472b6; --g:#4ade80; --y:#facc15; --c:#38bdf8; --b:#3b82f6;
  --good:#4ade80; --warn:#facc15; --bad:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{padding-bottom:84px;background:radial-gradient(900px 420px at 10% -10%,#3a1d3a55,transparent),radial-gradient(700px 400px at 100% 0,#11365055,transparent),var(--bg);background-attachment:fixed;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:800;margin:24px 0 10px}
h3{font-size:16px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink2)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.top .r{display:flex;align-items:center;gap:8px}
.help{width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 14px #ec489955}
.sync{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)} .dot.ok{background:var(--good)} .dot.loc{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.hero{border:0;color:#fff;background:linear-gradient(135deg,#ff7a3d 0%,#ff4d6d 55%,#c026d3 100%);box-shadow:0 10px 30px #ff4d6d44}
.hero .muted,.hero .tiny{color:#ffe4dc}
.hero .btn{background:#fff;color:#c2185b}
.hero .btn.ghost{background:#ffffff22;color:#fff;border:1px solid #ffffff55}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:14px;padding:11px 12px;background:var(--card2);position:relative;overflow:hidden}
.tile b{display:block;font-size:22px;font-weight:800}
.tile span{font-size:12px;color:var(--ink2)}
.tile.o{background:linear-gradient(135deg,#ff7a3d33,#ff7a3d0d)} .tile.v{background:linear-gradient(135deg,#a78bfa33,#a78bfa0d)} .tile.g{background:linear-gradient(135deg,#4ade8033,#4ade800d)} .tile.c{background:linear-gradient(135deg,#38bdf833,#38bdf80d)} .tile.y{background:linear-gradient(135deg,#facc1533,#facc150d)}
.btn{appearance:none;border:0;border-radius:13px;padding:12px 14px;font:inherit;font-weight:800;background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.acc{background:linear-gradient(135deg,#ff7a3d,#ff4d6d);color:#fff;box-shadow:0 6px 18px #ff4d6d44}
.btn.cool{background:linear-gradient(135deg,#38bdf8,#3b82f6);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%} .btn.danger{color:var(--bad)}
.btn:active{transform:scale(.97)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick button{border:0;border-radius:16px;padding:14px 12px;font:inherit;font-weight:800;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:86px}
.quick button em{font-style:normal;font-size:26px;line-height:1}
.quick button small{font-weight:600;opacity:.85;font-size:12px}
.q1{background:linear-gradient(135deg,#0ea5e9,#2563eb)} .q2{background:linear-gradient(135deg,#06b6d4,#0e7490)} .q3{background:linear-gradient(135deg,#8b5cf6,#6d28d9)} .q4{background:linear-gradient(135deg,#22c55e,#15803d)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o);border-color:transparent}
input::placeholder{color:#5d6576}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--ink2)}
.rec{background:#ff7a3d14;border-left:3px solid var(--o);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#ffe2d3;margin:8px 0}
.rec.c{background:#38bdf814;border-color:var(--c);color:#d5f1ff}
.rec.y{background:#facc1514;border-color:var(--y);color:#fbf0c4}
.rec.bad{background:#f8717118;border-color:var(--bad);color:#ffd9d9}
.rec.g{background:#4ade8014;border-color:var(--g);color:#d6f8e2}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0c0e13f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px 8px;z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--ink3);font:inherit;font-size:10.5px;font-weight:800;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
.nav button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.6}
.nav button.on{color:#fff;background:linear-gradient(135deg,#ff7a3d33,#c026d333)} .nav button.on i{filter:none;opacity:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week div{text-align:center;font-size:11px;color:#ffe4dc}
.week i{display:flex;align-items:center;justify-content:center;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:#ffffff22;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.week i.s{background:#fff;color:#e11d48} .week i.cd{background:#38bdf8;color:#04202c} .week i.t{outline:2px solid #fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.chip.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--cc,#38bdf8),#3b82f6)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{content-visibility:auto;contain-intrinsic-size:auto 230px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;position:relative}
.mcard svg{width:100%;height:auto;border-radius:11px;display:block}
.mcard b{display:block;font-size:13.5px;margin:7px 3px 0;line-height:1.25}
.mcard small{font-size:11px;color:var(--ink3);margin:0 3px;display:block}
.grp{display:flex;align-items:center;gap:8px}
.grp::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--gc)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap;margin:6px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend .m{width:12px;height:12px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.legend .a{width:16px;height:3px;background:#ffd166;border-radius:2px}
svg.mach .fr{stroke:#6f7a90;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg.mach .frh{stroke:#d5dbe6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.55;transform:translate(-1px,-1px)}
svg.mach .ml{stroke:#b9c1d0;stroke-width:6;stroke-linecap:round;fill:none}
svg.mach .plat{stroke:#c3cad6;stroke-width:9;stroke-linecap:round;fill:none}
svg.mach .pd{stroke:var(--pc,#2f6fde);stroke-width:11;stroke-linecap:round;fill:none}
svg.mach .pdh{stroke:#fff;stroke-width:2.5;stroke-linecap:round;fill:none;opacity:.28;transform:translate(-2px,-2px)}
svg.mach .pf{fill:var(--pc,#2f6fde)}
svg.mach .pl{fill:url(#gpl);stroke:#2b313d;stroke-width:1.5}
svg.mach .hdl{stroke:#1d222c;stroke-width:6;stroke-linecap:round;fill:none}
svg.mach .cab{stroke:#d5dbe6;stroke-width:1.6;fill:none}
svg.mach .rope{stroke:#111;stroke-width:4;stroke-linecap:round;fill:none}
svg.mach .lift{stroke:#facc15;stroke-width:6;stroke-linecap:round;fill:none}
svg.mach .fig{filter:drop-shadow(0 3px 3px #000a)}
svg.mach .fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.mach .sk{stroke:#f1bf92} svg.mach .skf{stroke:#c98f62} svg.mach .skc{fill:#f1bf92} svg.mach .skfc{fill:#c98f62}
svg.mach .pn{stroke:#2f3a52} svg.mach .pnf{stroke:#242d40}
svg.mach .shoe{stroke:#f4f6fa;stroke-width:7.5} svg.mach .shof{stroke:#aab2c0;stroke-width:7.5}
svg.mach .th{stroke-width:13} svg.mach .th2{stroke-width:14.5} svg.mach .shn{stroke-width:10} svg.mach .ua{stroke-width:9.5} svg.mach .fa{stroke-width:8.5}
svg.mach .neck{stroke-width:7}
svg.mach .shirt{stroke:#14b8a6;stroke-width:23} svg.mach .waist{stroke-width:21}
svg.mach .wf.shirt{stroke-width:26} svg.mach .wf.waist{stroke-width:24}
svg.mach .mu{fill:#ff3b3b;filter:url(#glow)}
svg.mach .wv{stroke:#7dd3fc;stroke-width:3;fill:none;stroke-linecap:round}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;color:var(--ink);font:inherit;cursor:pointer}
.badge b{display:block;font-size:12px;margin-top:8px;line-height:1.2}
.badge small{font-size:10.5px;color:var(--ink2)}
.bc{width:58px;height:58px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #ffffff18,0 6px 16px #0008,inset 0 -4px 8px #0004}
.bc span{font-size:28px;filter:drop-shadow(0 2px 2px #0006)}
.bc.big{width:110px;height:110px}.bc.big span{font-size:54px}
.badge.lock .bc,.bc.lockc{background:#2a303c;box-shadow:none}.badge.lock .bc span,.bc.lockc span{filter:grayscale(1);opacity:.35}
.badge.lock b{color:var(--ink3)}
.bar.sm{height:5px;margin:6px 8px 0}
.lvl{border:0;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777)}
.lvlnum{width:52px;height:52px;border-radius:16px;background:#ffffff26;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.cel{position:fixed;inset:0;z-index:120;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.cel .badge{pointer-events:none}
.celbox{position:relative;background:linear-gradient(160deg,#2b1747,#161a22);border:1px solid #ffffff22;border-radius:24px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px #000c}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;top:-30px;font-style:normal;font-size:18px;color:var(--cc,#facc15);text-shadow:0 0 8px currentColor;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.nextach{display:flex;gap:12px;align-items:center}
.nextach .bc{width:46px;height:46px;flex:0 0 46px}.nextach .bc span{font-size:22px}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding-bottom:96px}
.ohead{position:sticky;top:0;background:#0c0e13f5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.ohead .wrap{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ofoot{position:fixed;left:0;right:0;bottom:0;background:#0c0e13f5;border-top:1px solid var(--line);padding:10px 14px 12px;z-index:45}
.ofoot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.blockh{display:flex;align-items:center;gap:10px;margin:22px 0 6px;font-weight:800;font-size:17px}
.blockh i{font-style:normal;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ex{border-left:4px solid var(--gc,var(--o))}
.ex .hdr{display:flex;gap:10px;align-items:center}
.ex .thumb{width:72px;flex:0 0 72px;cursor:pointer}
.ex .thumb svg{width:72px;height:auto;border-radius:9px;display:block}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:6px;align-items:center;margin-top:8px}
.sets.one{grid-template-columns:26px 1fr 46px}
.sets .n{font-weight:800;color:var(--ink3);text-align:center}
.sets .h{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.sets input{padding:9px 6px;text-align:center;font-weight:800}
.sets .ok{height:40px;border-radius:11px;border:2px solid var(--line);background:var(--card2);color:var(--ink3);font-size:18px;font-weight:900;cursor:pointer}
.sets .ok.on{background:var(--good);border-color:var(--good);color:#052e14}
.sets input.dn{background:#4ade8018;border-color:#4ade8055}
.donebtn{border:2px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:12px;padding:10px;font:inherit;font-weight:800;width:100%;cursor:pointer;margin-top:10px}
.donebtn.on{background:var(--good);border-color:var(--good);color:#052e14}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px 16px 22px;border-top:1px solid var(--line)}
.modal svg.mach{width:100%;height:auto;border-radius:14px}
ol,ul{padding-left:20px;margin:6px 0} li{margin:4px 0}
.chart{position:relative;margin-top:6px;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);display:none}
.sore{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.sore button{padding:9px 0;border-radius:11px;border:0;color:#111;font:inherit;font-weight:800;cursor:pointer}
.sore small{display:block;font-size:9.5px;font-weight:700}
.stage{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .stage:last-child{border:0}
.stage .ck{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink3)}
.stage.done .ck{background:var(--good);border-color:var(--good);color:#06210f}
.stage.cur .ck{border-color:var(--y);color:var(--y);box-shadow:0 0 12px #facc1566}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#ff7a3d);border-radius:99px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
details summary{font-weight:800;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--ink3)} details[open] summary::after{content:"－"}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);font:inherit;font-weight:800;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,#ff7a3d,#ff4d6d);color:#fff}
.timer{display:flex;gap:6px;align-items:center}
.timer .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;color:var(--y)}
.timer.fire .t{color:var(--good)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line)} table.t td:last-child{text-align:right;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#232a37;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:130;font-weight:800;display:none;max-width:90vw;text-align:center}
.goalc{border-radius:16px;padding:12px;border:2px solid var(--line);background:var(--card2);cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.goalc.on{border-color:var(--gc);background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 30%,transparent),transparent)}
.goalc em{font-style:normal;font-size:24px;display:block}
.goalc b{display:block;font-size:14px;margin-top:4px}
.goalc small{font-size:11.5px;color:var(--ink2)}
.onb{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1b1030,#0c0e13 60%);display:flex;flex-direction:column}
.onb .body{flex:1;overflow:auto;max-width:560px;margin:0 auto;padding:30px 22px;width:100%}
.onb .ic{width:96px;height:96px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:50px;margin:10px 0 20px;box-shadow:0 12px 40px #0008}
.onb h1{font-size:25px;margin-bottom:10px}
.onb p{font-size:16px;color:#d8dbe3}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.onb .dots i{width:7px;height:7px;border-radius:99px;background:#ffffff33}
.onb .dots i.on{width:22px;background:#fff}
.onb .foot{display:flex;gap:10px;padding:12px 22px 22px;max-width:560px;margin:0 auto;width:100%}
.sess{cursor:pointer}
.hide{display:none!important}
.fitem{padding:9px 0;border-top:1px solid var(--line);cursor:pointer;gap:10px}
.chip{white-space:nowrap}
img.scene{width:100%;height:auto;content-visibility:auto;aspect-ratio:4/3;border-radius:11px;display:block;background:#2c3f2b}
.ex .thumb img.scene{width:72px;border-radius:9px}
.ni{display:inline-flex;vertical-align:middle;line-height:0}
.ni svg *{fill:none!important;stroke:var(--nc)!important;stroke-width:1.8px!important;stroke-linecap:round;stroke-linejoin:round}
.ni svg text{fill:var(--nc)!important;stroke:none!important}
.ni svg ellipse[opacity]{display:none}
.ni svg{filter:drop-shadow(0 0 1.4px var(--nc)) drop-shadow(0 0 5px var(--nc));overflow:visible}
.badge .ni svg{filter:drop-shadow(0 0 3px var(--nc))}.badge{content-visibility:auto;contain-intrinsic-size:auto 150px}
.badge.lock .ni svg{filter:none;opacity:.55}
.nav button i{filter:none!important;opacity:.4!important;font-size:0}
.nav button.on i{opacity:1!important}
.onb .ic{background:#0b0d12!important;border:1px solid #2a3142}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
  <marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
  <marker id="arwg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
  <radialGradient id="gpl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9aa3b5"/><stop offset="1" stop-color="#2e3440"/></radialGradient>
  <linearGradient id="gplate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6577"/><stop offset="1" stop-color="#2e3440"/></linearGradient>

<script>
/* ================= ГРУППЫ ================= */
const GRP={
  legs:{t:'Ноги и ягодицы',c:'#ff7a3d',pc:'#ea6a2f'},
  back:{t:'Спина',c:'#a78bfa',pc:'#7c5ce0'},
  chest:{t:'Грудь и плечи',c:'#ff5d8f',pc:'#e0457a'},
  arms:{t:'Руки',c:'#f472b6',pc:'#d9539c'},
  core:{t:'Пресс и бока',c:'#4ade80',pc:'#22a35a'},
  pull:{t:'Турник — путь к подтягиваниям',c:'#facc15',pc:'#c9a20e'},
  cardio:{t:'Кардио',c:'#38bdf8',pc:'#1f8fc7'},
  pool:{t:'Бассейн',c:'#3b82f6',pc:'#2563eb'},
  custom:{t:'Мои упражнения',c:'#94a3b8',pc:'#64748b'},
};

/* ================= РИСУНКИ (анимированные) ================= */
const R=v=>Math.round(v*10)/10;
const q=(a,dx=0,dy=0)=>`${R(a[0]+dx)} ${R(a[1]+dy)}`;
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const mid=(a,b)=>lerp(a,b,.5);
function ps(str){const t=str.trim().split(/\s+/),o={};for(let i=0;i<t.length;i+=3)o[t[i]]=[+t[i+1],+t[i+2]];return o}
const SPL='calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"';
// статика
const FR=d=>`<path class="fr" d="${d}"/><path class="frh" d="${d}"/>`;
const PAD=(d,w)=>`<path class="pd" d="${d}"${w?` style="stroke-width:${w}"`:''}/><path class="pdh" d="${d}"/>`;
const ML=d=>`<path class="ml" d="${d}"/>`;
const HDL=d=>`<path class="hdl" d="${d}"/>`;
const CIR=(x,y,r)=>`<circle class="pl" cx="${x}" cy="${y}" r="${r}"/><circle cx="${x}" cy="${y}" r="${Math.max(2,r/4)}" fill="#c3cad6"/>`;
const STACK=(x,y,w,h)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#1b2029" stroke="#59627a" stroke-width="1.5"/><line x1="${x+w/2}" y1="${y+4}" x2="${x+w/2}" y2="${y+h-4}" stroke="#c3cad6" stroke-width="1.5"/>`;
  for(let i=y+h-8;i>y+h*.45;i-=7)s+=`<rect x="${x+2}" y="${i-5}" width="${w-4}" height="6" rx="1.5" fill="url(#gplate)"/>`;return s};
// анимированные элементы
function aPath(cls,tpl,A,B,dur,extra=''){const a=tpl(A),b=tpl(B);return `<path class="${cls}" d="${a}"${extra}>${a!==b?`<animate attributeName="d" dur="${dur}s" values="${a};${b};${a}" ${SPL}/>`:''}</path>`}
function aCirc(cls,fn,r,A,B,dur){const a=fn(A),b=fn(B);const an=(k,i)=>a[i]!==b[i]?`<animate attributeName="${k}" dur="${dur}s" values="${R(a[i])};${R(b[i])};${R(a[i])}" ${SPL}/>`:'';
  return `<circle class="${cls}" cx="${R(a[0])}" cy="${R(a[1])}" r="${r}">${an('cx',0)}${an('cy',1)}</circle>`}
function aMus(fn,rx,ry,rot,A,B,dur){const a=fn(A),b=fn(B);const an=(k,i)=>a[i]!==b[i]?`<animate attributeName="${k}" dur="${dur}s" values="${R(a[i])};${R(b[i])};${R(a[i])}" ${SPL}/>`:'';
  return `<ellipse class="mu" cx="${R(a[0])}" cy="${R(a[1])}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${R(a[0])} ${R(a[1])})">${an('cx',0)}${an('cy',1)}<animate attributeName="opacity" dur="${dur}s" values=".25;1;.25" ${SPL}/></ellipse>`}
const SK='#f1bf92',SKF='#c98f62',HAIR='#3a2a20';
function headG(a,b,dur,front,f){
  const an=(a[0]!==b[0]||a[1]!==b[1])?`<animateTransform attributeName="transform" type="translate" dur="${dur}s" values="${q(a)};${q(b)};${q(a)}" ${SPL}/>`:'';
  const face=front?`<circle cx="-10" cy="1.5" r="2.4" fill="${SKF}"/><circle cx="10" cy="1.5" r="2.4" fill="${SKF}"/><circle r="10.5" fill="${SK}"/><circle cx="-3.8" cy="0" r="1.6" fill="#1b1b1b"/><circle cx="3.8" cy="0" r="1.6" fill="#1b1b1b"/><circle cx="-6" cy="3.5" r="2" fill="#ff8a7a" opacity=".45"/><circle cx="6" cy="3.5" r="2" fill="#ff8a7a" opacity=".45"/><path d="M-4 4.6 Q0 8.2 4 4.6" stroke="#7a2e1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>`
   :`<circle r="10.5" fill="${SK}"/><circle cx="${f*10.3}" cy="1.2" r="2.2" fill="${SK}"/><circle cx="${-f*1.8}" cy="1.5" r="2.5" fill="${SKF}"/><circle cx="${f*5.4}" cy="-0.6" r="1.6" fill="#1b1b1b"/><circle cx="${f*4.5}" cy="4" r="2" fill="#ff8a7a" opacity=".45"/><path d="M${f*3.2} 5.4 Q${f*6.6} 8 ${f*9.2} 4.4" stroke="#7a2e1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const hair=front?`<path d="M-10.6 -0.5 Q-11 -12.5 0 -12.2 Q11 -12.5 10.6 -0.5 Q7 -8 0 -7.6 Q-7 -8 -10.6 -0.5Z" style="fill:${HAIR}"/>`
   :`<path d="M${-f*10.6} 2 Q${-f*11.5} -12 ${f*1} -12.2 Q${f*9} -12 ${f*10.2} -4 Q${f*5} -8.5 ${-f*1} -6.5 Q${-f*5} -4 ${-f*6} 3Z" style="fill:${HAIR}"/>`;
  return `<g transform="translate(${q(a)})">${an}${face}${hair}</g>`}
function figure(A,B,dur,front,face=1){
  const g=(p,k,d)=>p[k]||p[d];
  const sh=(p,n)=>front?g(p,'s'+n,'n'):[p.n[0],p.n[1]+5];
  const hip=(p,n)=>g(p,'h'+n,'hp'),K=(p,n)=>g(p,'k'+n,'k1'),F=(p,n)=>g(p,'f'+n,'f1'),E=(p,n)=>g(p,'e'+n,'e1'),W=(p,n)=>g(p,'w'+n,'w1');

  if(!Array.isArray(S.profile.goals))S.profile.goals=P.goals; if(!S.profile.custom)S.profile.custom={};if(!S.profile.ach)S.profile.ach={};if(!S.profile.flags)S.profile.flags={};

    <button class="q2" data-act="cardioOnly" data-ex="pool"><em>${NI('pool',30,'#fff')}</em>Бассейн<small>время и метры</small></button>

function homeAch(){const X=xpInfo(),n=nextAch(),got=Object.keys(S.profile.ach||{}).length;
  let h=`<div class="card lvl" data-act="goAch" style="cursor:pointer;padding:12px 14px"><div class="row between"><div class="row"><div class="lvlnum" style="width:42px;height:42px;font-size:20px">${X.lvl}</div><div><b>${X.title}</b><div class="tiny" style="color:#e9d5ff"> ${got}/${ACH.length} ачивок · ${X.xp} XP</div></div></div><span style="font-size:20px">›</span></div><div class="bar" style="margin-top:8px;background:#ffffff22"><i style="width:${Math.round(X.prog*100)}%"></i></div>`;
  if(n){const [a,c,t]=n,T=TIER[a[4]];h+=`<div class="nextach" style="margin-top:10px">${MED(a,true,42)}<div style="flex:1"><div class="tiny" style="color:#e9d5ff">Ближайшая ачивка</div><b>${esc(a[2])}</b><div class="tiny" style="color:#f5d0fe">${esc(a[3])} · ${Math.min(c,t)}/${t}</div></div></div>`}
  return h+`</div>`}
function vMachines(){
  const order=['legs','back','chest','arms','core','pull','cardio','pool','custom'];
  let out=header('Тренажёры')+`<div class="legend"><span><i class="m"></i>красным — мышцы, которые работают</span><span><i class="a"></i>стрелка — направление движения</span></div>
   <div class="rec c">Не знаешь тренажёр? Сфотографируй и пришли мне в чат Claude — скажу, как называется, и добавлю. Или добавь сам: «+ своё упражнение» внизу.</div>`;
  for(const g of order){const items=Object.entries(EX).filter(([k,e])=>e.g===g);if(!items.length)continue;
    out+=`<h2 class="grp" style="--gc:${GRP[g].c}">${GRP[g].t}</h2><div class="mgrid">${items.map(([k,e])=>`<button class="mcard" data-act="info" data-ex="${k}">${svgFor(k)}<b>${esc(e.name)}</b><small>${esc(e.en||'')}</small></button>`).join('')}</div>`}
  return out+`<button class="btn ghost full" data-act="customNew" style="margin-top:14px">+ своё упражнение</button>`;
}

let LOGSEL='lat_pulldown',LOGMODE='list',OPEN=null;
function vLog(){
  let body='';
  if(LOGMODE==='list'){const ss=sorted().reverse();
    if(!ss.length)body=`<div class="card"><p>Пока пусто. Открой план на главной и начни тренировку — здесь появится история.</p></div>`;
    else body=ss.map(s=>{const open=OPEN===s.id;let det='';
      if(open){det=(s.items||[]).map(it=>{const E=EX[it.ex];if(!E)return '';const v=it.sets.map(x=>E.type==='t'?`${x.t}с`:E.type==='r'?`${x.r}`:`${x.w}×${x.r}`).join(' · ');const eff=E.type==='a'?` <span class="pill">сам: ${r1(bwOn(s.date)-topSet(it.ex,it.sets))} кг</span>`:'';return `<tr><td>${esc(short(E.name))}${eff}</td><td>${v}</td></tr>`}).join('');
        det+=(s.cardio||[]).map(c=>`<tr><td>${NI(CICON[c.ex]||'heart',15)} ${esc(short(EX[c.ex]?EX[c.ex].name:c.ex))}</td><td>${c.min||0} мин${c.speed?` · ${c.speed} км/ч`:''}${c.incline?` · ${c.incline}%`:''}${c.level?` · ур.${c.level}`:''}${c.km?` · ${c.km} км`:''}${c.m?` · ${c.m} м`:''}${c.style?` · ${esc(c.style)}`:''}${c.pulse?` · ${c.pulse}`:''}</td></tr>`).join('');
        det=`<table class="t" style="margin-top:8px">${det}</table>`;if(s.note)det+=`<p class="tiny">${NI('journal',14)} ${esc(s.note)}</p>`;const sv=soreAfter(s.date);if(sv!=null)det+=`<p class="tiny">Мышцы наутро: ${sv}/5</p>`;
        det+=`<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn sm ghost danger" data-act="del" data-id="${s.id}">Удалить</button></div>`}
      const tag=hasStrength(s)?(s.day?`<span class="pill" style="background:#ff7a3d33;color:#ffb08a">${s.day}</span>`:'<span class="pill">своя</span>'):'<span class="pill" style="background:#38bdf833;color:#7dd3fc">кардио</span>';
      return `<div class="card sess" data-act="open" data-id="${s.id}"><div class="row between"><b>${fmtD(s.date)}</b>${tag}</div><div class="tiny">${sessSummary(s)}</div>${det}</div>`}).join('');
  }else{
    const opts=Object.entries(EX).map(([k,e])=>`<option value="${k}" ${k===LOGSEL?'selected':''}>${esc(e.name)}</option>`).join('');
    const E=EX[LOGSEL]||EX.lat_pulldown;let ch='',note='';
    if(LOGSEL==='pool'){const h=cardioHist('pool');ch=`<h3>Дистанция, м</h3>`+chart(h.filter(c=>c.m).map(c=>({x:c.date,y:+c.m,l:`${c.min} мин`})),{unit:'м',color:'#3b82f6'});
      ch+=`<h3 style="margin-top:14px">Темп, мин на 100 м <span class="tiny">(ниже = быстрее)</span></h3>`+chart(h.filter(c=>c.m&&c.min).map(c=>({x:c.date,y:r1(c.min/(c.m/100))})),{unit:'мин/100м',color:'#3b82f6'})}
    else if(E.fields){const h=cardioHist(LOGSEL);ch=`<h3>Минуты</h3>`+chart(h.map(c=>({x:c.date,y:+c.min,l:[c.speed&&c.speed+' км/ч',c.incline&&c.incline+'%',c.level&&'ур. '+c.level].filter(Boolean).join(', ')})),{unit:'мин',color:'#38bdf8'});
      if(LOGSEL==='treadmill')ch+=`<h3 style="margin-top:14px">Наклон, %</h3>`+chart(h.filter(c=>num(c.incline)!=null).map(c=>({x:c.date,y:+c.incline})),{unit:'%',color:'#38bdf8'})}
    else{const h=histFor(LOGSEL),col=GRP[E.g].c;
      if(E.type==='a'){ch=`<h3>Сколько поднимаешь сам, кг</h3>`+chart(h.map(x=>({x:x.date,y:r1(bwOn(x.date)-topSet(LOGSEL,x.sets)),l:`противовес ${topSet(LOGSEL,x.sets)} кг`})),{unit:'кг',color:col});note='Твой вес минус противовес. Дойдёт до веса тела — подтянешься сам.'}
      else if(E.type==='t')ch=`<h3>Лучшее время, сек</h3>`+chart(h.map(x=>({x:x.date,y:topSet(LOGSEL,x.sets)})),{unit:'сек',color:col});
      else if(E.type==='r')ch=`<h3>Лучший подход, повторы</h3>`+chart(h.map(x=>({x:x.date,y:topSet(LOGSEL,x.sets)})),{unit:'повт.',color:col});
      else ch=`<h3>Рабочий вес, кг</h3>`+chart(h.map(x=>({x:x.date,y:topSet(LOGSEL,x.sets),l:'× '+x.sets.map(s=>s.r).join('/')})),{unit:'кг',color:col})}
    body=`<div class="card"><label class="f">Упражнение</label><select data-act="logsel">${opts}</select><div style="margin-top:12px">${ch}</div>${note?`<p class="tiny">${note}</p>`:''}</div>`}
  return header('Журнал')+`<div class="seg"><button data-act="logmode" data-v="list" class="${LOGMODE==='list'?'on':''}">История</button><button data-act="logmode" data-v="prog" class="${LOGMODE==='prog'?'on':''}">Прогресс</button></div>`+body+
   `<details><summary>${NI('cloud',18)} Резервная копия</summary><p class="tiny">Записи хранятся на телефоне. Раз в пару недель сохраняй копию — например, отправь себе в Telegram «Избранное». Пригодится при смене телефона.</p><button class="btn sm cool" data-act="export">Сохранить копию</button>
   <textarea id="imp" rows="3" placeholder="Вставь сюда сохранённый текст для восстановления" style="margin-top:10px"></textarea><button class="btn sm" data-act="import" style="margin-top:6px">Восстановить из текста</button></details>`;
}

let GMODE='goals';
function vGoal(){
  const w=curW(),ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),{st,cur}=pullInfo();
  const tips=['Сейчас главное — вис и гравитрон. Вис — в тренировке B, гравитрон — в A.','Гравитрон: каждую неделю пробуй убрать 5 кг. В тренировку B добавлены лопаточные подтягивания.','В тренировку A добавлены негативы: 2 подхода по 2–3 медленных опускания.','Ты близко. Гравитрон с маленьким противовесом + негативы. Раз в неделю пробуй одно чистое подтягивание.','Подтягивания уже в начале тренировки A — 3–4 попытки с отдыхом 2 минуты.','Делай подходы по 1–2 — каждую неделю на 1 повтор больше.','Подходы по 2–3 + негативы в конце. До 5 — рукой подать.'];
  const goal=S.profile.goal,start=ws.length?ws[0].kg:S.profile.w,prog=start>goal?Math.max(0,Math.min(1,(start-w)/(start-goal))):0;
  const gsel=Object.entries(GOALS).map(([k,g])=>{const on=g.fixed||S.profile.goals.includes(k);return `<button class="goalc ${on?'on':''}" style="--gc:${g.c}" data-act="${g.fixed?'':'goalT'}" data-g="${k}"><em>${NI(g.e,30,g.c)}</em><b>${g.t}</b><small>${on?'✓ ':''}${g.d}</small></button>`}).join('');
  const extraCnt=S.profile.goals.filter(k=>GOALS[k]&&GOALS[k].add).length;
  const goalCard=(k,title,text,exs)=>{if(!S.profile.goals.includes(k))return '';const g=GOALS[k];
    const rows=exs.map(e=>{const h=histFor(e);const l=h[h.length-1];return `<tr><td>${esc(short(EX[e].name))}</td><td>${l?(EX[e].type==='r'?topSet(e,l.sets)+' повт.':topSet(e,l.sets)+' кг'):'ещё не было'}</td></tr>`}).join('');
    return `<div class="card" style="border-color:${g.c}55"><span class="pill" style="background:${g.c}33;color:${g.c}">${NI(g.e,14,g.c)} ${title}</span><p style="margin-top:8px;font-size:14px">${text}</p><table class="t">${rows}</table></div>`};
  const seg=`<div class="seg" style="margin-bottom:12px"><button data-act="gmode" data-v="goals" class="${GMODE==='goals'?'on':''}">${NI('target',16)} Цели</button><button data-act="gmode" data-v="ach" class="${GMODE==='ach'?'on':''}">${NI('trophy',16)} Ачивки</button></div>`;
  if(GMODE==='ach')return header('Цели')+seg+vAch();
  return header('Цели')+seg+`
  <p class="tiny">Нажми на цель — её упражнения добавятся в тренировки A и B.</p>
  <div class="grid2">${gsel}</div>
  ${extraCnt>=3?`<div class="rec y">Включено 3 доп. цели — тренировка станет длиннее (~1,5 часа с кардио). Если не успеваешь, оставь 1–2.</div>`:''}
  <div class="card" style="border-color:#facc1555;background:linear-gradient(135deg,#facc1518,transparent)"><span class="pill" style="background:#facc1533;color:#facc15">${NI('pullbar',14)} Главная цель</span><h2 style="margin:8px 0">Научиться подтягиваться</h2>
   ${st.map((s,i)=>`<div class="stage ${s[1]?'done':i===cur?'cur':''}"><div class="ck">${s[1]?'✓':i+1}</div><div style="flex:1"><b>${s[0]}</b>${s[2]?`<br><span class="tiny">${s[2]}</span>`:''}${!s[1]&&i===cur?`<div class="bar"><i style="width:${Math.round(Math.min(1,s[3])*100)}%"></i></div>`:''}</div></div>`).join('')}
   ${cur>=0?`<div class="rec y">${tips[cur]}</div>`:`<div class="rec g">Цель взята! Дальше — 8–10 подтягиваний.</div>`}
   <p class="tiny">Программа сама добавляет упражнения на турнике по мере прохождения этапов. А −10 кг веса делают подтягивание заметно легче.</p></div>
  <div class="card" style="border-color:#ff7a3d55"><span class="pill" style="background:#ff7a3d33;color:#ffb08a">${NI('scale',14)} Вес</span>
   <div class="grid3" style="margin-top:10px"><div class="tile o"><b>${r1(start)}</b><span>старт</span></div><div class="tile y"><b>${r1(w)}</b><span>сейчас</span></div><div class="tile g"><b>${goal}</b><span>цель</span></div></div>
   <div class="bar" style="margin-top:12px"><i style="width:${Math.round(prog*100)}%"></i></div>
   <p class="tiny">Здоровый темп — 0,5–1 кг в неделю. Взвешивайся утром натощак 1–2 раза в неделю, колебания ±1 кг — это вода.</p>
   <div class="row"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="Вес, кг"><button class="btn acc" data-act="saveW">Записать</button></div>
   <div class="row" style="margin-top:8px"><label class="f" style="margin:0;white-space:nowrap">Целевой вес</label><input type="number" inputmode="decimal" value="${goal}" data-act="goal" style="max-width:110px"></div>
   <div style="margin-top:12px">${chart(ws.map(x=>({x:x.d,y:x.kg})),{unit:'кг'})}</div></div>
  ${goalCard('abs','Пресс и бока','Кубики появятся, когда уйдёт жир с живота — это в основном питание. Тренировки делают мышцы сильнее и берегут спину. Бока точечно не «сжечь» — они уходят с общим весом.',['ab_bench','leg_raise','torso_rotation'])}
  ${goalCard('arms','Руки','Руки растут и от базы: тяги нагружают бицепс, жимы — трицепс. Доп. упражнения добавляют объёма.',['biceps_curl','triceps_pushdown'])}
  ${goalCard('thighs','Бёдра («уши»)','Честно: жир нельзя убрать из одного места тренажёром. Сведение и разведение укрепляют мышцы, а жир уходит с общим похудением — у мужчин бёдра и живот часто уходят последними. Не бросай: при −10–15 кг разница будет заметна.',['adductor','abductor','glute_kick'])}`;
}

function addCardio(ex){const r=cardioRec(ex);D.cardio.push(Object.assign({},r.v,{rec:r.text,done:false}))}
function setRow(E,s,i,j){

  return `<div class="n">${i+1}</div><input class="${dn}" type="number" inputmode="decimal" step="0.5" data-k="w" data-j="${j}" data-i="${i}" value="${s.w??''}" placeholder="кг"><input class="${dn}" type="number" inputmode="numeric" data-k="r" data-j="${j}" data-i="${i}" value="${s.r??''}" placeholder="${s.sr??'повт.'}">${ok}`}

function finishWorkout(){
  const items=D.items.map(it=>{const E=EX[it.ex];const sets=it.sets.filter(s=>s.done).map(s=>{const o={};if(E.type==='t')o.t=num(s.t)??num(s.st)??0;else{o.r=num(s.r)??num(s.sr)??0;if(E.type==='w'||E.type==='a')o.w=num(s.w)??0}return o});return {ex:it.ex,sets}}).filter(it=>it.sets.length);
  const cardio=D.cardio.filter(c=>c.done).map(c=>{const o={ex:c.ex};EX[c.ex].fields.forEach(f=>{if(f==='style'){if(c.style)o.style=c.style}else{const v=num(c[f]);if(v!=null)o[f]=v}});return o});
  if(!items.length&&!cardio.length){toast('Пока ничего не отмечено ✓ — отметь подходы или кардио');return}
  const sw=D.sweat&&num(D.sweat.b)&&num(D.sweat.a)?{b:num(D.sweat.b),a:num(D.sweat.a)}:null;
  const ex=S.sessions.find(s=>s.kind==='gym'&&s.date===D.date&&s.id!==D.id);
  if(ex){items.forEach(it=>{const o=(ex.items||[]).find(x=>x.ex===it.ex);if(o)o.sets.push(...it.sets);else(ex.items=ex.items||[]).push(it)});ex.cardio=(ex.cardio||[]).concat(cardio);if(!ex.day&&D.day)ex.day=D.day;if(D.note)ex.note=(ex.note?ex.note+' · ':'')+D.note;if(sw)ex.sweat=sw;toast('Добавлено к тренировке за этот день ')}
  else{const s={id:D.id,kind:'gym',date:D.date,ts:Date.now(),day:items.length?D.day:null,items,cardio};if(D.note)s.note=D.note;if(sw)s.sweat=sw;S.sessions.push(s);toast('Тренировка сохранена ')}
  if(sw&&sw.b>sw.a)setTimeout(()=>toast(`С потом ушло ${r1(sw.b-sw.a)} л — выпей за вечер ~${r1((sw.b-sw.a)*1.5)} л`),2600);
  persist([monthId(D.date)]);D=null;try{localStorage.removeItem(LSD)}catch(e){}stopTimer();renderWorkout();TAB='home';render();checkAch();
}

function startRest(sec){stopTimer();TLEFT=sec;const t=$('#tleft');if(!t)return;t.classList.remove('hide');$('#timer').classList.remove('fire');

function showCelebrate(list){CELQ=CELQ.concat(list);if($('#cel').innerHTML)return;renderCel()}
function renderCel(){if(!CELQ.length){$('#cel').innerHTML='';return}const list=CELQ;CELQ=[];const X=xpInfo();
  const conf=Array.from({length:28},(_,i)=>`<i style="--cc:${['#facc15','#22d3ee','#f472b6','#4ade80'][i%4]};left:${Math.random()*100}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.6).toFixed(2)}s">${['●','■','●','▲','●','■'][i%6]}</i>`).join('');
  const one=list.length===1?list[0]:null,T=one?TIER[one[4]]:null;
  $('#cel').innerHTML=`<div class="cel"><div class="conf">${conf}</div><div class="celbox">
    <div class="tiny" style="letter-spacing:.12em;text-transform:uppercase;color:#fde68a">${list.length===1?'Новая ачивка!':'Новые ачивки: '+list.length}</div>
    ${one?`<div class="pop" style="margin:14px auto">${MED(one,true,120)}</div><h1>${esc(one[2])}</h1><p class="muted">${esc(one[3])}</p><span class="pill" style="background:${T.c2}66;color:${T.c1}">${T.n} · +${T.xp} XP</span>`
      :`<div class="bgrid" style="margin:16px 0">${list.slice(0,9).map(a=>badge(a,true,1,1)).join('')}</div>${list.length>9?`<p class="tiny">и ещё ${list.length-9}…</p>`:''}`}
    <p style="margin-top:14px;font-weight:800">Уровень ${X.lvl} · ${X.title}</p><div class="bar" style="margin:6px 30px"><i style="width:${Math.round(X.prog*100)}%"></i></div>
    <button class="btn acc full" data-act="celClose" style="margin-top:16px">Круто! </button></div></div>`}

/* ================= ЗНАКОМСТВО ================= */
const ONB=[
 ['star','linear-gradient(135deg,#ff7a3d,#c026d3)','Привет! Это твой дневник зала','Здесь план тренировок, подсказки по весу, картинки тренажёров, цели и питание. Пролистай — 30 секунд, и всё будет понятно. Вернуться сюда можно кнопкой <b>?</b> в правом верхнем углу.'],
 ['home','linear-gradient(135deg,#ff4d6d,#ff7a3d)','Главная','Оранжевая карточка — твоя следующая тренировка (A и B чередуются). Под ней — неделя: белый кружок = силовая, голубой = кардио. Ниже быстрые кнопки: только кардио, бассейн, вес, тренажёры.'],
 ['eye','linear-gradient(135deg,#22c55e,#0f766e)','Сначала план — потом старт','«Посмотреть план» только показывает упражнения — <b>ничего не записывается</b>. Нажми на картинку, чтобы узнать, как делать. Выбери кардио внизу и жми «▶ Начать».'],
 ['check','linear-gradient(135deg,#16a34a,#4ade80)','Отмечай подходы галочкой','Вес и повторы уже подсказаны серым. Сделал — нажми <b>✓</b>: значения подставятся, запустится таймер отдыха. Сделал по-другому — впиши свои цифры. Сохраняются <b>только отмеченные</b> подходы. В конце — «Завершить».'],
 ['heart','linear-gradient(135deg,#38bdf8,#2563eb)','Кардио-блок','В конце тренировки — отдельный блок: дорожка, эллипс, велосипед, гребля, бассейн. Добавь нужное, впиши минуты и нажми «Отметить: сделано». Приложение каждый раз чуть прибавляет нагрузку.'],
 ['target','linear-gradient(135deg,#facc15,#f97316)','Цели','Подтягивания и вес — всегда. Включи <b>пресс</b>, <b>руки</b> или <b>бёдра</b> — их упражнения сами добавятся в тренировки. По мере успехов на турнике программа добавляет негативы и подтягивания.'],
 ['dumbbell','linear-gradient(135deg,#a78bfa,#6d28d9)','Тренажёры','Все тренажёры по группам мышц. На картинках показано упражнение: <span style="color:#ff6b6b">красным</span> подсвечены работающие мышцы, жёлтой стрелкой — движение. Нажми на тренажёр — там описание и как правильно делать. Нет нужного — «+ своё упражнение».'],
 ['trophy','linear-gradient(135deg,#7c3aed,#db2777)','Ачивки и уровни','За тренировки, сброшенные килограммы, кардио и шаги к подтягиваниям ты получаешь <b>ачивки</b> (бронза, серебро, золото) и опыт. Растёт уровень: от «Новичка» до «Титана». Смотри в «Цели →  Ачивки» и на главной.'],
 ['bandage','linear-gradient(135deg,#fb923c,#ef4444)','Наутро после зала','Приложение спросит, как болят мышцы (0–5). Ответь честно: если 4–5, в следующий раз нагрузка будет мягче.'],
 ['cloud','linear-gradient(135deg,#0ea5e9,#6366f1)','Журнал и копия','В «Журнале» история и графики прогресса. Там же <b>«Резервная копия»</b> — раз в пару недель отправляй её себе в Telegram. Удачи в зале! '],
];
let OI=0;
function renderOnb(){if(OI<0){$('#onb').innerHTML='';return}const [ic,bg,t,p]=ONB[OI];
  $('#onb').innerHTML=`<div class="onb"><div class="body"><div class="row between"><span class="tiny">${OI+1} / ${ONB.length}</span><button class="btn sm ghost" data-act="onbEnd">Пропустить</button></div><div class="ic">${NI(ic,58)}</div><h1>${t}</h1><p>${p}</p></div>
   <div class="dots">${ONB.map((_,i)=>`<i class="${i===OI?'on':''}"></i>`).join('')}</div>
   <div class="foot">${OI>0?`<button class="btn ghost" data-act="onbPrev">Назад</button>`:''}<button class="btn acc" style="flex:1" data-act="onbNext">${OI===ONB.length-1?'Поехали!':'Далее →'}</button></div></div>`}
function endOnb(){OI=-1;lsSet(LSO,1);renderOnb();if(!S.profile.flags.tour){S.profile.flags.tour=1;persist(['profile'])}checkAch()}

/* ================= СОБЫТИЯ ================= */
document.addEventListener('click',async e=>{
  const nb=e.target.closest('#nav button');if(nb){TAB=nb.dataset.tab;render();window.scrollTo(0,0);return}
  const tg=e.target.closest('[data-tab-go]');if(tg){TAB=tg.dataset.tabGo;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='mclose'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  switch(a){
   case 'gmode':GMODE=el.dataset.v;render();break;
   case 'goAch':TAB='goal';GMODE='ach';render();window.scrollTo(0,0);break;
   case 'achInfo':achModal(el.dataset.id);break;
   case 'celClose':$('#cel').innerHTML='';if(CELQ.length)renderCel();render();break;
   case 'fmode':FMODE=el.dataset.v;render();break;
   case 'fday':{const n=addDays(FDATE||today(),+el.dataset.v);if(n<=today()){FDATE=n;render()}break}
   case 'frate':S.profile.rate=+el.dataset.v;persist(['profile']);render();break;
   case 'foodAdd':foodModal(el.dataset.m);break;
   case 'foodPick':foodModal(el.dataset.m,'amount',el.dataset.k);break;
   case 'fu':{const i=$('#fAmt');const k=document.querySelector('[data-act="foodSave"]').dataset.k,fd=FOOD[k];
     if(el.dataset.v==='g'){i.dataset.ug=1;i.value=fd.ug;$('#fUnitL').textContent=/мл/.test($('#fuG').textContent)?'мл':'г'}else{i.dataset.ug=fd.ug;i.value=1;$('#fUnitL').textContent=fd.u}
     $('#fuU').classList.toggle('on',el.dataset.v==='u');$('#fuG').classList.toggle('on',el.dataset.v==='g');updFoodPrev(k);break}
   case 'foodSave':{const i=$('#fAmt');const g=(num(i.value)||0)*(+i.dataset.ug);if(!g){toast('Укажи количество');return}addFoodEntry(FDATE||today(),el.dataset.k,g,$('#fMeal').value);closeModal();render();toast('Добавлено');checkAch();break}
   case 'foodCombo':addCombo(FDATE||today(),el.dataset.k,el.dataset.m||'s');closeModal();render();toast('Добавлено');checkAch();break;
   case 'foodQuick':{const k=el.dataset.k,d=FDATE||today(),m=new Date().getHours()<11?'b':'s';if(COMBOS[k])addCombo(d,k,m);else addFoodEntry(d,k,FOOD[k].ug||100,m);render();toast('Добавлено: '+(COMBOS[k]?COMBOS[k].n:FOOD[k].n));checkAch();break}
   case 'foodMy':myFoodModal();break;
   case 'mfSave':{const n=$('#mfN').value.trim(),kc=num($('#mf_kc').value);if(!n||kc==null){toast('Нужны название и ккал на 100 г');return}
     const k='my_'+uid();S.profile.myFoods=S.profile.myFoods||{};S.profile.myFoods[k]={n,kc,p:num($('#mf_p').value)||0,f:num($('#mf_f').value)||0,c:num($('#mf_c').value)||0,u:$('#mfU').value.trim()||null,ug:num($('#mfUg').value)||null};
     if(!S.profile.myFoods[k].ug)S.profile.myFoods[k].u=null;buildFoods();persist(['profile']);closeModal();toast('Продукт сохранён: '+n);break}
   case 'foodEdit':editEntryModal(el.dataset.id);break;
   case 'feSave':{const d=FDATE||today(),e=dayFood(d).find(x=>x.id===el.dataset.id),g=num($('#feG').value);if(e&&g){Object.assign(e,portion(FOOD[e.key],g),{g});persist([foodMonth(d)])}closeModal();render();break}
   case 'feDel':{const d=FDATE||today();S.food[d]=dayFood(d).filter(x=>x.id!==el.dataset.id);persist([foodMonth(d)]);closeModal();render();break}
   case 'onb':OI=0;renderOnb();break; case 'onbNext':if(OI>=ONB.length-1)endOnb();else{OI++;renderOnb()}break; case 'onbPrev':OI=Math.max(0,OI-1);renderOnb();break; case 'onbEnd':endOnb();break;
   case 'preview':if(D){toast('Сначала закончи или отмени начатую тренировку');D=lsGet(LSD);renderWorkout();break}openPreview(el.dataset.day);break;
   case 'pvDay':PV.day=el.dataset.v;PV.cardio=lastCardio(PV.day);renderPreview();break;
   case 'pvCardio':{const c=el.dataset.ex;PV.cardio=PV.cardio.includes(c)?PV.cardio.filter(x=>x!==c):PV.cardio.concat(c);renderPreview();break}
   case 'pvClose':PV=null;renderPreview();break;
   case 'start':newDraft(PV.day,PV.cardio,programFor(PV.day));PV=null;renderWorkout();window.scrollTo(0,0);break;
   case 'cardioOnly':if(lsGet(LSD)){D=lsGet(LSD);toast('У тебя есть начатая тренировка — кардио добавь в неё');renderWorkout();break}newDraft('',[el.dataset.ex],[]);renderWorkout();break;
   case 'resume':D=lsGet(LSD);renderWorkout();break;
   case 'weigh':weighModal();break;
   case 'info':infoModal(el.dataset.ex);break;
   case 'mclose':closeModal();break;
   case 'sore':S.sore[today()]=+el.dataset.v;persist(['profile']);render();toast('Учтено ');checkAch();break;
   case 'open':if(e.target.closest('[data-act="del"]'))return;OPEN=OPEN===el.dataset.id?null:el.dataset.id;render();break;
   case 'del':{e.stopPropagation();if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Точно удалить?';return}const s=S.sessions.find(x=>x.id===el.dataset.id);S.sessions=S.sessions.filter(x=>x.id!==el.dataset.id);if(s)persist([monthId(s.date)]);OPEN=null;render();break}
   case 'logmode':LOGMODE=el.dataset.v;render();break;
   case 'goalT':{const g=el.dataset.g,gs=S.profile.goals;S.profile.goals=gs.includes(g)?gs.filter(x=>x!==g):gs.concat(g);persist(['profile']);render();toast(S.profile.goals.includes(g)?'Упражнения добавлены в тренировки':'Цель выключена');checkAch();break}
   case 'saveW':if(saveWeight($('#wIn').value))render();break;
   case 'saveW2':if(saveWeight($('#wIn2').value)){closeModal();render()}break;
   case 'export':{S.profile.flags.backup=1;persist(['profile']);setTimeout(checkAch,800);const txt=JSON.stringify(S);if(window.Android&&Android.share){Android.share(txt);break}try{await navigator.clipboard.writeText(txt);toast('Скопировано — вставь в заметки')}catch(_){const t=$('#imp');t.value=txt;t.select();toast('Скопируй текст из поля')}break}
   case 'import':{try{const o=JSON.parse($('#imp').value);if(!o.profile||!Array.isArray(o.sessions))throw 0;S=Object.assign(DEF(),o);normalize();const ids=new Set(['profile']);S.sessions.forEach(s=>ids.add(monthId(s.date)));persist([...ids]);render();toast('Данные восстановлены');checkAch()}catch(_){toast('Не похоже на сохранённые данные')}break}
   case 'customNew':customModal();break;
   case 'customSave':{const n=$('#cN').value.trim();if(!n){toast('Напиши название');return}const id='c_'+uid();S.profile.custom[id]={name:n,type:$('#cT').value,g:$('#cG').value,start:null};normalize();persist(['profile']);
     if(D){addItem(id);saveDraft();closeModal();renderWorkout()}else{closeModal();render()}toast('Добавлено: '+n);checkAch();break}
   case 'customDel':{delete S.profile.custom[el.dataset.ex];normalize();persist(['profile']);closeModal();render();break}
   // тренировка
   case 'tick':{const it=D.items[+el.dataset.j],s=it.sets[+el.dataset.i],E=EX[it.ex];s.done=!s.done;
     if(s.done){if(E.type==='t'){if(num(s.t)==null)s.t=s.st}else{if(num(s.r)==null)s.r=s.sr}}
     saveDraft();renderWorkout();if(s.done)startRest(E.type==='t'||E.type==='r'?60:90);break}
   case 'ctick':{const c=D.cardio[+el.dataset.cj];c.done=!c.done;saveDraft();renderWorkout();break}
   case 'addset':{const it=D.items[+el.dataset.j],l=it.sets[it.sets.length-1]||{};it.sets.push({w:l.w,sr:l.sr,st:l.st,done:false});saveDraft();renderWorkout();break}
   case 'rmset':{const it=D.items[+el.dataset.j];if(it.sets.length>1)it.sets.pop();saveDraft();renderWorkout();break}
   case 'rmitem':D.items.splice(+el.dataset.j,1);saveDraft();renderWorkout();break;
   case 'rmcardio':D.cardio.splice(+el.dataset.cj,1);saveDraft();renderWorkout();break;
   case 'pick':pickModal();break;
   case 'additem':addItem(el.dataset.ex);saveDraft();closeModal();renderWorkout();toast('Добавлено');break;
   case 'addcardio':addCardio(el.dataset.ex);saveDraft();renderWorkout();setTimeout(()=>{const c=document.querySelectorAll('.overlay .ex');c.length&&c[c.length-1].scrollIntoView({behavior:'smooth',block:'center'})},50);break;
   case 'rest':startRest(+el.dataset.s);break;
   case 'closeW':saveDraft();D=null;stopTimer();renderWorkout();render();break;
   case 'finishW':finishWorkout();break;
   case 'cancelW':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажми ещё раз — тренировка не сохранится';return}D=null;try{localStorage.removeItem(LSD)}catch(_){}stopTimer();renderWorkout();render();break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(D&&t.dataset.k!=null){D.items[+t.dataset.j].sets[+t.dataset.i][t.dataset.k]=t.value;saveDraft();return}
  if(D&&t.dataset.cf){D.cardio[+t.dataset.cj][t.dataset.cf]=t.value;saveDraft();return}
  if(D&&t.dataset.act==='dnote'){D.note=t.value;saveDraft();return}
  if(D&&(t.dataset.act==='sweatB'||t.dataset.act==='sweatA')){D.sweat=D.sweat||{};D.sweat[t.dataset.act==='sweatB'?'b':'a']=t.value;saveDraft();return}
  if(t.id==='fSearch'){const q=t.value.trim().toLowerCase();const keys=q?Object.keys(FOOD).filter(k=>FOOD[k].n.toLowerCase().includes(q)).slice(0,40):(S.profile.recentFoods||[]);$('#fList').innerHTML=foodList(keys,t.dataset.meal,q?'':'Недавние');return}
  if(t.id==='fAmt'){const b=document.querySelector('[data-act="foodSave"]');b&&updFoodPrev(b.dataset.k);return}
  if(D&&t.dataset.act==='ddate'){if(t.value)D.date=t.value;saveDraft();return}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='logsel'){LOGSEL=t.value;render();return}
  if(t.dataset.act==='goal'){const v=num(t.value);if(v){S.profile.goal=v;persist(['profile']);render()}return}
  if(t.dataset.prof){const v=num(t.value);if(v){S.profile[t.dataset.prof]=v;persist(['profile']);render()}return}
  if(t.dataset.ov){const v=num(t.value);if(v!=null){S.profile.foodOv=S.profile.foodOv||{};(S.profile.foodOv[t.dataset.ov]=S.profile.foodOv[t.dataset.ov]||{})[t.dataset.q]=v;buildFoods();persist(['profile'])}return}});

window.androidBack=function(){
  if($('#cel').innerHTML){$('#cel').innerHTML='';render();return true}
  if(OI>=0&&$('#onb').innerHTML){endOnb();return true}
  if($('#md').innerHTML){closeModal();return true}
  if(PV){PV=null;renderPreview();return true}
  if(D){saveDraft();D=null;stopTimer();renderWorkout();render();return true}
  if(TAB!=='home'){TAB='home';render();window.scrollTo(0,0);return true}
  return false};

buildFoods();
document.body.insertAdjacentHTML('afterbegin',IDEFS);
document.querySelectorAll('#nav i[data-ic]').forEach(i=>i.innerHTML=NI(i.dataset.ic,24));
render();
if(!lsGet(LSO)){OI=0;renderOnb()}else{OI=-1;setTimeout(checkAch,600)}
initDb();
